<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#151615"><title>内容管理 · 启程</title><link rel="stylesheet" href="/admin/admin.css"><script src="/admin/admin.js" type="module"></script><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23151615'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23d8ef79' stroke-width='2'/%3E%3C/svg%3E"></head><body>
<header class="topbar"><a class="admin-brand" href="/" target="_blank" rel="noopener"><span class="brand-mark">Q.</span><span>内容管理<span class="brand-sub">ADMISSIONS STUDIO</span></span></a><div class="top-actions"><a class="view-site" href="/" target="_blank" rel="noopener">查看前台</a><button id="save" class="primary" disabled>保存并更新</button></div></header>
<div class="workspace"><aside class="sidebar"><p class="nav-label">网站内容</p><nav id="chapter-nav" aria-label="篇章选择"></nav><button class="settings-tab" id="settings-tab">网站设置</button><div class="sidebar-note">选择篇章修改图文。<br>保存后，前台内容立即更新。</div></aside>
<main><div class="page-heading"><div><span class="eyebrow" id="editor-kicker">CONTENT EDITOR</span><h1 id="editor-title">正在加载内容</h1></div><button id="reload" class="quiet">重新加载</button></div><div class="status-line"><span id="status" role="status" aria-live="polite">正在获取网站内容…</span><span id="saved-time"></span></div><div id="error" role="alert" hidden></div>
<div class="editor-grid" id="editor" hidden><form id="chapter-form" autocomplete="off"><section class="form-section"><h2>篇章文字</h2><div class="field-row"><label>目录名称<input name="name" maxlength="100" required></label><label>英文标签<input name="category" maxlength="100"></label></div><label>主标题（可留空）<textarea name="title" rows="2" maxlength="120"></textarea><span class="field-help">留空时不显示主标题。按回车换行，建议保持在两行以内。</span></label><label>正文<textarea name="body" rows="4" maxlength="600"></textarea></label><label>画面下方说明<input name="caption" maxlength="100"></label></section>
<section class="form-section"><h2>文字大小</h2><div class="field-row"><label>主标题字号 <span id="title-size-value">60 px</span><input name="titleSize" type="range" min="24" max="80" step="1"></label><label>正文字号 <span id="body-size-value">16 px</span><input name="bodySize" type="range" min="12" max="28" step="1"></label></div><p class="field-help">每个篇章单独设置。字号以桌面为基准，手机端与预览画面会适当缩放。</p></section>
<section class="form-section"><h2>文字位置</h2><div class="field-row"><label>标题左右移动 <span id="titleX-value">0%</span><input name="titleX" type="range" min="-50" max="50" step="1"></label><label>标题上下移动 <span id="titleY-value">0%</span><input name="titleY" type="range" min="-50" max="50" step="1"></label></div><div class="field-row"><label>正文左右移动 <span id="bodyX-value">0%</span><input name="bodyX" type="range" min="-50" max="50" step="1"></label><label>正文上下移动 <span id="bodyY-value">0%</span><input name="bodyY" type="range" min="-50" max="50" step="1"></label></div><p class="field-help">负值向左或向上，正值向右或向下。文字会保持在画面内；较长正文可滚动阅读。</p></section>
<section class="form-section"><h2>篇章图片</h2><div class="upload-area"><div><strong id="image-name">当前图片</strong><p>JPG、PNG 或 WebP，最大 8 MB</p></div><label class="upload-button">替换图片<input id="image-file" type="file" accept="image/jpeg,image/png,image/webp"></label></div><label>图片说明<input name="alt" maxlength="100" required><span class="field-help">用一句话描述图片，方便屏幕阅读器用户理解。</span></label><div class="field-row"><label>水平取景 <span id="x-value">50%</span><input name="positionX" type="range" min="0" max="100"></label><label>垂直取景 <span id="y-value">50%</span><input name="positionY" type="range" min="0" max="100"></label></div></section></form>
<aside class="preview-column"><span class="preview-label">即时预览</span><div class="preview-card"><img id="preview-image" alt="当前篇章图片预览"><div class="preview-shade"></div><div class="preview-copy"><span id="preview-kicker"></span><h2 id="preview-title"></h2><p id="preview-body"></p></div></div><p id="preview-caption"></p><p class="preview-help">此处展示当前草稿，保存后才会更新前台。</p></aside></div>
<form id="settings-form" class="settings-form" autocomplete="off" hidden><section class="form-section"><h2>网站标识</h2><div class="field-row"><label>学校 / 网站名称<input name="brand" maxlength="100" required></label><label>英文名称<input name="brandEnglish" maxlength="100"></label></div><label>顶部介绍<input name="edition" maxlength="100"></label><label>顶部右侧标签<input name="badge" maxlength="100"></label><label>画面上方栏目名称<input name="exploreLabel" maxlength="100"></label></section><section class="form-section"><h2>页脚文字</h2><label>左侧文字<input name="footerLeft" maxlength="100"></label><label>左侧英文文字<input name="footerEnglish" maxlength="100"></label><label>右侧文字<input name="footerRight" maxlength="100"></label></section><section class="form-section"><h2>页面信息</h2><label>浏览器标题<input name="browserTitle" maxlength="100" required></label><label>网站描述<textarea name="description" rows="3" maxlength="300"></textarea></label></section></form>
</main></div><div id="toast" role="status" hidden></div>
</body></html>
